[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "okane"
version = "0.1.0"
description = "Okane: a read-only reconciliation copilot for payroll and fixed-asset open items."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "python-calamine==0.9.1",
    "duckdb==2.0.0",
    "rapidfuzz==3.14.6",
    "sse-starlette==3.7.0",
    "watchdog==7.1.0",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "xlsxwriter==3.3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:apscheduler.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

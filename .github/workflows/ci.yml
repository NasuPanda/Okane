name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forbidden-files:
    name: No confidential files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on spreadsheets, databases, caches, secrets, data or private docs
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(xlsx|xls|xlsm|duckdb|feather|joblib)$|(^|/)\.env$|(^|/)\.env\.[^/]+$' | grep -v '\.env\.example$' || true)
          data=$(git ls-files 'data/**' | grep -v '/\.gitkeep$' | grep -v '^data/\.gitkeep$' || true)
          ref=$(git ls-files 'docs/reference' 'docs/reference/**' || true)
          note=$(git ls-files 'docs/NOTE.md' || true)
          status=0
          for list in "$bad" "$data" "$ref" "$note"; do
            if [ -n "$list" ]; then echo "Forbidden tracked file(s):"; echo "$list"; status=1; fi
          done
          # Committed fixtures must come from the synthetic generator, never from real data.
          for f in $(git ls-files 'fixtures/*.json'); do
            grep -q '"synthetic": true' "$f" || { echo "Fixture not marked synthetic: $f"; status=1; }
          done
          exit $status

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # ASSUMPTION (A34): required status checks need GitHub Pro/Team on a private repo, so main
  # cannot block a red merge. This job only reports: it opens one "main is red" issue.
  main-is-red:
    needs: [forbidden-files, backend, frontend]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="CI is failing on main"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL (commit ${GITHUB_SHA::7})"
          else
            gh issue create --title "$title" --body "CI failed on main at ${GITHUB_SHA::7}: $RUN_URL"
          fi
